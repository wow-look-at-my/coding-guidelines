name: Deploy PR previews

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build/

  deploy-preview:
    needs: build
    if: always()
    uses: PazerOP/pr-preview-action/.github/workflows/preview.yml@master
    with:
      artifact-name: build
    secrets: inherit
